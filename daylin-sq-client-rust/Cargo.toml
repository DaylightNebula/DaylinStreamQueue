[package]
name = "daylin-sq-client-rust"
version = "0.0.1"
edition = "2024"
description = "Submits and consumes events of a daylin-sq server"

# calling https addresses needs the system to have CA certificates, http does not once this is turned off
[features]
default = ["https"]
https = ["reqwest/rustls"]

[dependencies]
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
log = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["charset", "json", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "rt", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
uuid = { version = "1", features = ["serde"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
